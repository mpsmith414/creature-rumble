<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Announcer audition</title>
    <style>
      body { font: 16px system-ui, sans-serif; margin: 1.5rem; background: #1b1a24; color: #f4f0e6; }
      h1 { margin: 0 0 .25rem; }
      .bar { display: flex; gap: 1.5rem; align-items: center; flex-wrap: wrap; margin: 1rem 0; }
      table { border-collapse: collapse; width: 100%; }
      th, td { padding: .35rem .5rem; border-bottom: 1px solid #3a3850; text-align: left; vertical-align: top; }
      button { font: inherit; padding: .35rem .7rem; border-radius: .5rem; border: 0; background: #ffb703; color: #1b1a24; cursor: pointer; }
      button:disabled { opacity: .5; cursor: wait; }
      #status { color: #9fe8b5; min-height: 1.4em; }
    </style>
  </head>
  <body>
    <h1>Announcer audition</h1>
    <p>Press a button to hear that voice read that line. The first press for each voice can take a few seconds while its model loads.</p>
    <div class="bar">
      <label><input type="checkbox" id="arena" checked /> arena sound (with crowd hum)</label>
      <label>speed <input type="range" id="speed" min="0.9" max="1.3" step="0.01" value="1.12" /> <output id="speedOut">1.12</output></label>
    </div>
    <div id="status"></div>
    <table id="grid"></table>
    <script type="module" src="/src/announcer/audition.ts"></script>
  </body>
</html>
